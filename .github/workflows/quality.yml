name: Code quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python docker/check-code.py
      - run: python docker/test-inventory-workflow-math.py
      - run: python docker/test-purchase-calculations.py
      - run: docker compose -f compose.dev.yaml config --quiet
        env:
          DB_ROOT_PASSWORD: ci-configuration-only
          ADMIN_PASSWORD: ci-configuration-only
      - run: docker compose -f compose.prod.yaml config --quiet
        env:
          DB_ROOT_PASSWORD: ci-configuration-only
          ADMIN_PASSWORD: ci-configuration-only
          SITE_NAME: ci.example.invalid
